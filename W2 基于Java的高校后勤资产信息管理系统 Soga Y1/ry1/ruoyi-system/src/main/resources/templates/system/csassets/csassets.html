<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('资产管理列表')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>资产ID：</label>
                                <input type="text" name="assetId"/>
                            </li>
                            <li>
                                <label>资产名称：</label>
                                <input type="text" name="assetName"/>
                            </li>
                            <li>
                                <label>购买日期：</label>
                                <input type="text" class="time-input" placeholder="请选择购买日期" name="purchaseDate"/>
                            </li>
                            <li>
                                <label>价值：</label>
                                <input type="text" name="value"/>
                            </li>
                            <li>
                                <label>资产状态：</label>
                                <select name="status">
                                    <option value="">所有</option>
                                    <option value="0">闲置</option>
                                    <option value="1">在用</option>
                                    <option value="2">维修</option>
                                </select>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="system:csassets:add">
                    <i class="fa fa-plus"></i> 添加
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="system:csassets:edit">
                    <i class="fa fa-edit"></i> 修改
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="system:csassets:remove">
                    <i class="fa fa-remove"></i> 删除
                </a>
                <!--         <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="system:csassets:export">
                   <i class="fa fa-download"></i> 导出
                </a>-->
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('system:csassets:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:csassets:remove')}]];
        var statusDatas = [[${@dict.getType('zichan')}]];
        var prefix = ctx + "system/csassets";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "资产管理",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: '资产详情ID',
                    visible: false
                },
                {
                    field: 'assetId',
                    title: '资产ID'
                },
                {
                    field: 'assetName',
                    title: '资产名称'
                },
                {
                    field: 'purchaseDate',
                    title: '购买日期'
                },
                {
                    field: 'value',
                    title: '价值'
                },
                {
                    field: 'status',
                    title: '资产状态',
                    formatter: function(value, row, index) {
                        if (value === '0') {
                            return '<span class="badge badge-info">闲置</span>';
                        } else if (value === '1') {
                            return '<span class="badge badge-success">在用</span>';
                        } else if (value === '2') {
                            return '<span class="badge badge-warning">维修</span>';
                        } else {
                            return $.table.selectDictLabel(statusDatas, value);
                        }
                    }
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });
    </script>
</body>
</html>
