<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('采购申请列表')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>提交采购申请的用户ID：</label>
                                <input type="text" name="userId"/>
                            </li>
                            <li>
                                <label>物品名称：</label>
                                <input type="text" name="itemName"/>
                            </li>
                            <li>
                                <label>申请日期：</label>
                                <input type="text" class="time-input" placeholder="请选择申请日期" name="requestDate"/>
                            </li>
                            <li>
                                <label>申请状态：</label>
                                <select name="status" class="form-control" th:if="${@permission.hasRole('admin')}">
                                    <option value="">所有</option>
                                    <option value="0">待审核</option>
                                    <option value="1">通过</option>
                                    <option value="2">拒绝</option>
                                </select>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="system:purchase:add">
                    <i class="fa fa-plus"></i> 新增
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="system:purchase:edit">
                    <i class="fa fa-edit"></i> 修改
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="system:purchase:remove">
                    <i class="fa fa-remove"></i> 删除
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="system:purchase:export">
                    <i class="fa fa-download"></i> 导出
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('system:purchase:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:purchase:remove')}]];
        var statusDatas = [
            { dictValue: "1", dictLabel: "通过" },
            { dictValue: "2", dictLabel: "拒绝" }
        ];
        var prefix = ctx + "system/purchase";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "采购申请",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: '采购申请ID',
                    visible: false
                },
                {
                    field: 'userId',
                    title: '提交采购申请的用户ID'
                },
                {
                    field: 'itemName',
                    title: '物品名称'
                },
                {
                    field: 'quantity',
                    title: '物品数量'
                },
                {
                    field: 'estimatedPrice',
                    title: '预计单价'
                },
                {
                    field: 'totalPrice',
                    title: '总价'
                },
                {
                    field: 'purposeDescription',
                    title: '用途说明'
                },
                {
                    field: 'requestDate',
                    title: '申请日期'
                },
                {
                    field: 'status',
                    title: '申请状态',
                    formatter: function(value, row, index) {
                        if (value === "0") return "待审核";
                        if (value === "1") return "通过";
                        if (value === "2") return "拒绝";
                        return value;
                    }
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });
    </script>
</body>
</html>
