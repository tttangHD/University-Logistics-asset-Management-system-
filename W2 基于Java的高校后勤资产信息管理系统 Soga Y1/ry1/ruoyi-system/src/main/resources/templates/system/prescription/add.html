<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增处方管理模块，用于管理医生开具的处方信息。')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-prescription-add">
            <div class="form-group">    
                <label class="col-sm-3 control-label">患者ID：</label>
                <div class="col-sm-8">
                    <input name="patientId" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">医生ID：</label>
                <div class="col-sm-8">
                    <input name="doctorId" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">药品：</label>
                <div class="col-sm-8">
                    <input name="medication" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">剂量：</label>
                <div class="col-sm-8">
                    <input name="dosage" class="form-control" type="text">
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "system/prescription"
        $("#form-prescription-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-prescription-add').serialize());
            }
        }
    </script>
</body>
</html>
