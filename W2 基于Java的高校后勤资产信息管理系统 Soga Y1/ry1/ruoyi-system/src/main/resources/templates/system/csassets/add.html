<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增资产管理')" />
    <th:block th:include="include :: datetimepicker-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-csassets-add">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">资产ID：</label>
                <div class="col-sm-8">
                    <input name="assetId" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">资产名称：</label>
                <div class="col-sm-8">
                    <input name="assetName" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">资产类型：</label>
                <div class="col-sm-8">
                    <input name="assetType" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">序列号：</label>
                <div class="col-sm-8">
                    <input name="serialNumber" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">购买日期：</label>
                <div class="col-sm-8">
                    <div class="input-group date">
                        <input name="purchaseDate" class="form-control" placeholder="yyyy-MM-dd" type="text" required>
                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                    </div>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">保修到期日：</label>
                <div class="col-sm-8">
                    <div class="input-group date">
                        <input name="warrantyExpiry" class="form-control" placeholder="yyyy-MM-dd" type="text">
                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                    </div>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">价值：</label>
                <div class="col-sm-8">
                    <input name="value" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">资产状态：</label>
                <div class="col-sm-8">
                    <select name="status" class="form-control m-b">
                        <option value="0">闲置</option>
                        <option value="1">在用</option>
                        <option value="2">维修</option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">维护记录：</label>
                <div class="col-sm-8">
                    <textarea name="maintenanceRecords" class="form-control"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/csassets"
        $("#form-csassets-add").validate({
            focusCleanup: true,
            rules: {
                assetId: {
                    required: true
                },
                assetName: {
                    required: true
                },
                purchaseDate: {
                    required: true
                },
                value: {
                    required: true
                }
            }
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-csassets-add').serialize());
            }
        }

        $("input[name='purchaseDate']").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });

        $("input[name='warrantyExpiry']").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });
    </script>
</body>
</html>
